[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chemsampler"
version = "0.1.0"
description = "Sample the chemical space around a molecule using generative models from the Ersilia Model Hub"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name="Arnau", email="arnau@ersilia.io"}
]
requires-python = ">=3.10"

dependencies = [
  "ersilia==0.1.62",
  "rdkit==2024.3.6",
  "pandas==2.3.0",
  "rich==14.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
